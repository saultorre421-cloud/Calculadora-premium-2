<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora Táctil Profesional - Caja</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .phone-frame {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 860px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Pantalla de visualización */
        .display {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 24px 20px;
            word-break: break-all;
            background: #ffffff;
        }

        .d-expression {
            font-size: 46px;
            font-weight: 500;
            color: #1a1a1a;
            min-height: 56px;
            text-align: right;
            user-select: none;
            line-height: 1.2;
        }

        .d-result {
            font-size: 26px;
            color: #888888;
            min-height: 32px;
            margin-top: 6px;
            font-weight: 400;
            text-align: right;
        }

        /* Barra de herramientas */
        .utility-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 1px solid #f0f0f0;
            background: #ffffff;
        }

        .utility-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #555;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .utility-btn:active {
            background-color: #f2f2f2;
        }

        /* Teclado numérico */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background-color: #ebebeb;
            padding-bottom: env(safe-area-inset-bottom, 10px);
        }

        button.key {
            background-color: #ffffff;
            border: none;
            outline: none;
            height: 72px;
            font-size: 26px;
            font-weight: 500;
            color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
        }

        button.key:active {
            background-color: #e5e5e5;
        }

        button.key.op {
            color: #2b78e4;
            font-size: 26px;
        }

        button.key.clear {
            color: #e74c3c;
        }

        button.key.equals {
            background-color: #27ae60;
            color: white;
            font-size: 30px;
        }

        button.key.equals:active {
            background-color: #219150;
        }

        /* Historial emergente */
        .history-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            z-index: 100;
        }

        .history-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70%;
            background: #ffffff;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
        }

        .history-header h3 {
            margin: 0;
            font-size: 17px;
            color: #333;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .history-item {
            text-align: right;
            border-bottom: 1px solid #f5f5f5;
            padding-bottom: 10px;
            cursor: pointer;
        }

        .history-item-expr {
            font-size: 15px;
            color: #777;
        }

        .history-item-res {
            font-size: 20px;
            color: #27ae60;
            font-weight: bold;
        }

        .empty-history {
            text-align: center;
            color: #aaa;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <!-- Pantalla Superior -->
    <div class="display">
        <div class="d-expression" id="displayArea">0</div>
        <div class="d-result" id="liveResultArea"></div>
    </div>

    <!-- Barra de Accesos Rápidos -->
    <div class="utility-bar">
        <button class="utility-btn" onclick="toggleHistory(true)" title="Historial">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </button>
        <button class="utility-btn" onclick="handleBackspace()" title="Retroceso">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
        </button>
    </div>

    <!-- Teclado Numérico -->
    <div class="keypad">
        <button class="key clear" onclick="handleClear()">C</button>
        <button class="key op" onclick="insertParentheses()">( )</button>
        <button class="key op" onclick="insertText('%')">%</button>
        <button class="key op" onclick="insertText('÷')">÷</button>

        <button class="key" onclick="insertText('7')">7</button>
        <button class="key" onclick="insertText('8')">8</button>
        <button class="key" onclick="insertText('9')">9</button>
        <button class="key op" onclick="insertText('×')">×</button>

        <button class="key" onclick="insertText('4')">4</button>
        <button class="key" onclick="insertText('5')">5</button>
        <button class="key" onclick="insertText('6')">6</button>
        <button class="key op" onclick="insertText('-')">-</button>

        <button class="key" onclick="insertText('1')">1</button>
        <button class="key" onclick="insertText('2')">2</button>
        <button class="key" onclick="insertText('3')">3</button>
        <button class="key op" onclick="insertText('+')">+</button>

        <button class="key op" onclick="insertPlusMinus()">±</button>
        <button class="key" onclick="insertText('0')">0</button>
        <button class="key" onclick="insertText('.')">.</button>
        <button class="key equals" onclick="commitToHistory()">=</button>
    </div>

    <!-- Panel de Historial Deslizable -->
    <div class="history-overlay" id="historyOverlay" onclick="toggleHistory(false)">
        <div class="history-panel" onclick="event.stopPropagation()">
            <div class="history-header">
                <h3>Historial de Cálculos</h3>
                <button class="utility-btn" onclick="clearAllHistory()" title="Borrar Historial">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eb4d4b" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            </div>
            <div class="history-list" id="historyList">
                <div class="empty-history">No hay operaciones recientes</div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentExpression = "";
    let historyData = [];

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz0jWIN_loSAftgC56lUR5Yzrid3qW-qmJBqssVOUHzwZYidNSu2VLEZ-Wq8B2rq3dZ/exec";

    const displayArea = document.getElementById('displayArea');
    const liveResultArea = document.getElementById('liveResultArea');
    const historyOverlay = document.getElementById('historyOverlay');
    const historyList = document.getElementById('historyList');

    function sendToSheets(expr, res) {
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                expression: expr,
                result: res
            })
        }).then(() => {
            console.log("Enviado a Google Sheets");
        }).catch(err => {
            console.error("Error:", err);
        });
    }

    function updateDisplay() {
        displayArea.innerText = currentExpression || "0";
        updateLiveResult();
    }

    function insertText(val) {
        currentExpression += val;
        updateDisplay();
    }

    function handleBackspace() {
        if (currentExpression.length > 0) {
            currentExpression = currentExpression.slice(0, -1);
            updateDisplay();
        }
    }

    function handleClear() {
        currentExpression = "";
        liveResultArea.innerText = "";
        updateDisplay();
    }

    function insertParentheses() {
        const leftCount = (currentExpression.match(/\(/g) \vert{}\vert{} []).length;         const rightCount = (currentExpression.match(/\)/g) || []).length;
        const lastChar = currentExpression.slice(-1);

        if (leftCount > rightCount && !['+', '-', '×', '÷', '('].includes(lastChar) && currentExpression.length > 0) {
            insertText(')');
        } else {
            insertText('(');
        }
    }

    function insertPlusMinus() {
        if (!currentExpression) return;
        if (currentExpression.startsWith('-')) {
            currentExpression = currentExpression.slice(1);
        } else {
            currentExpression = '-' + currentExpression;
        }
        updateDisplay();
    }

    function calculateLive() {
        if (!currentExpression) return "";
        try {
            let sanitized = currentExpression
                .replace(/×/g, '*')
                .replace(/÷/g, '/')
                .replace(/%/g, '/100');

            if (/[+\-*\/]$/.test(sanitized)) return "";

            let total = Function('"use strict";return (' + sanitized + ')')();
            if (total !== undefined && !isNaN(total) && isFinite(total)) {
                return Number.isInteger(total) ? total.toString() : parseFloat(total.toFixed(6)).toString();
            }
            return "";
        } catch (e) {
            return "";
        }
    }

    function updateLiveResult() {
        const res = calculateLive();
        if (res && res !== "Error" && currentExpression.length > 0) {
            liveResultArea.innerText = "= " + res;
        } else {
            liveResultArea.innerText = "";
        }
    }

    function commitToHistory() {
        let liveResult = calculateLive();
        if (liveResult && liveResult !== "Error") {
            historyData.push({
                expr: currentExpression,
                res: liveResult
            });
            renderHistory();

            sendToSheets(currentExpression, liveResult);

            currentExpression = liveResult;
            updateDisplay();
            liveResultArea.innerText = "";
        }
    }

    function toggleHistory(show) {
        historyOverlay.style.display = show ? 'block' : 'none';
    }

    function renderHistory() {
        if (historyData.length === 0) {
            historyList.innerHTML = '<div class="empty-history">No hay operaciones recientes</div>';
            return;
        }
        historyList.innerHTML = "";
        historyData.slice().reverse().forEach(item => {
            const row = document.createElement('div');
            row.className = 'history-item';
            row.innerHTML = `<div class="history-item-expr">${item.expr} =</div>
                             <div class="history-item-res">${item.res}</div>`;
            row.onclick = () => {
                currentExpression = item.res;
                updateDisplay();
                toggleHistory(false);
            };
            historyList.appendChild(row);
        });
    }

    function clearAllHistory() {
        historyData = [];
        renderHistory();
    }

    // Inicializar visualización con 0
    updateDisplay();
</script>
</body>
</html>
