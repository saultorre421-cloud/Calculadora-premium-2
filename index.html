<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculadora Táctil Profesional - Caja</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .phone-frame {
            width: 100%;
            max-width: 430px;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .display {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 24px 20px;
            word-break: break-all;
            background: #ffffff;
        }

        .d-expression {
            font-size: 48px;
            font-weight: 500;
            color: #1a1a1a;
            min-height: 58px;
            text-align: right;
            line-height: 1.2;
            width: 100%;
        }

        .d-result {
            font-size: 26px;
            color: #888888;
            min-height: 32px;
            margin-top: 6px;
            font-weight: 400;
            text-align: right;
            width: 100%;
        }

        .utility-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            border-bottom: 1px solid #f0f0f0;
            background: #ffffff;
        }

        .utility-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #555;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .utility-btn:active {
            background-color: #f2f2f2;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background-color: #ebebeb;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        button.key {
            background-color: #ffffff;
            border: none;
            outline: none;
            height: 74px;
            font-size: 28px;
            font-weight: 500;
            color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        button.key:active {
            background-color: #e5e5e5;
        }

        button.key.op {
            color: #2b78e4;
            font-size: 28px;
        }

        button.key.clear {
            color: #e74c3c;
        }

        button.key.equals {
            background-color: #27ae60;
            color: #ffffff;
            font-size: 32px;
        }

        button.key.equals:active {
            background-color: #219150;
        }

        .history-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            z-index: 50;
        }

        .history-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70%;
            background: #ffffff;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
        }

        .history-header h3 {
            margin: 0;
            font-size: 17px;
            color: #333;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .history-item {
            text-align: right;
            border-bottom: 1px solid #f5f5f5;
            padding-bottom: 10px;
            cursor: pointer;
        }

        .history-item-expr {
            font-size: 15px;
            color: #777;
        }

        .history-item-res {
            font-size: 20px;
            color: #27ae60;
            font-weight: bold;
        }

        .empty-history {
            text-align: center;
            color: #aaa;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <div class="display">
        <div class="d-expression" id="displayArea">0</div>
        <div class="d-result" id="liveResultArea"></div>
    </div>

    <div class="utility-bar">
        <button type="button" class="utility-btn" id="btnHistory" title="Historial">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </button>
        <button type="button" class="utility-btn" id="btnBackspace" title="Retroceso">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
        </button>
    </div>

    <div class="keypad">
        <button type="button" class="key clear" data-action="clear">C</button>
        <button type="button" class="key op" data-action="parens">( )</button>
        <button type="button" class="key op" data-val="%">%</button>
        <button type="button" class="key op" data-val="÷">÷</button>

        <button type="button" class="key" data-val="7">7</button>
        <button type="button" class="key" data-val="8">8</button>
        <button type="button" class="key" data-val="9">9</button>
        <button type="button" class="key op" data-val="×">×</button>

        <button type="button" class="key" data-val="4">4</button>
        <button type="button" class="key" data-val="5">5</button>
        <button type="button" class="key" data-val="6">6</button>
        <button type="button" class="key op" data-val="-">-</button>

        <button type="button" class="key" data-val="1">1</button>
        <button type="button" class="key" data-val="2">2</button>
        <button type="button" class="key" data-val="3">3</button>
        <button type="button" class="key op" data-val="+">+</button>

        <button type="button" class="key op" data-action="plusminus">±</button>
        <button type="button" class="key" data-val="0">0</button>
        <button type="button" class="key" data-val=".">.</button>
        <button type="button" class="key equals" data-action="equals">=</button>
    </div>

    <div class="history-overlay" id="historyOverlay">
        <div class="history-panel" id="historyPanel">
            <div class="history-header">
                <h3>Historial de Cálculos</h3>
                <button type="button" class="utility-btn" id="btnClearHistory" title="Borrar Historial">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eb4d4b" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            </div>
            <div class="history-list" id="historyList">
                <div class="empty-history">No hay operaciones recientes</div>
            </div>
        </div>
    </div>
</div>

<script>
    let expr = "";
    let historyData = [];

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz0jWIN_loSAftgC56lUR5Yzrid3qW-qmJBqssVOUHzwZYidNSu2VLEZ-Wq8B2rq3dZ/exec";

    const displayArea = document.getElementById('displayArea');
    const liveResultArea = document.getElementById('liveResultArea');
    const historyOverlay = document.getElementById('historyOverlay');
    const historyPanel = document.getElementById('historyPanel');
    const historyList = document.getElementById('historyList');

    function sendToSheets(op, res) {
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ expression: op, result: res })
        }).catch(err => console.error("Error Sheets:", err));
    }

    function renderDisplay() {
        displayArea.innerText = expr.length === 0 ? "0" : expr;
        const res = calcResult(expr);
        liveResultArea.innerText = (res && expr.length > 0) ? "= " + res : "";
    }

    function calcResult(val) {
        if (!val) return "";
        try {
            let s = val.replace(/×/g, '*').replace(/÷/g, '/').replace(/%/g, '/100');
            if (/[+\-*\/]$/.test(s)) return "";
            let out = Function('"use strict";return (' + s + ')')();
            if (out !== undefined && !isNaN(out) && isFinite(out)) {
                return Number.isInteger(out) ? out.toString() : parseFloat(out.toFixed(6)).toString();
            }
            return "";
        } catch (e) {
            return "";
        }
    }

    function handleInput(val) {
        expr += val;
        renderDisplay();
    }

    function handleClear() {
        expr = "";
        renderDisplay();
    }

    function handleBackspace() {
        if (expr.length > 0) {
            expr = expr.slice(0, -1);
            renderDisplay();
        }
    }

    function handleParens() {
        const left = (expr.match(/\(/g) \vert{}\vert{} []).length;         const right = (expr.match(/\)/g) || []).length;
        const last = expr.slice(-1);
        if (left > right && !['+', '-', '×', '÷', '('].includes(last) && expr.length > 0) {
            expr += ')';
        } else {
            expr += '(';
        }
        renderDisplay();
    }

    function handlePlusMinus() {
        if (!expr) return;
        if (expr.startsWith('-')) {
            expr = expr.slice(1);
        } else {
            expr = '-' + expr;
        }
        renderDisplay();
    }

    function handleEquals() {
        const res = calcResult(expr);
        if (res) {
            historyData.push({ op: expr, res: res });
            sendToSheets(expr, res);
            updateHistoryUI();
            expr = res;
            renderDisplay();
            liveResultArea.innerText = "";
        }
    }

    function updateHistoryUI() {
        if (historyData.length === 0) {
            historyList.innerHTML = '<div class="empty-history">No hay operaciones recientes</div>';
            return;
        }
        historyList.innerHTML = "";
        historyData.slice().reverse().forEach(item => {
            const row = document.createElement('div');
            row.className = 'history-item';
            row.innerHTML = `<div class="history-item-expr">${item.op} =</div><div class="history-item-res">${item.res}</div>`;
            row.onclick = () => {
                expr = item.res;
                renderDisplay();
                historyOverlay.style.display = 'none';
            };
            historyList.appendChild(row);
        });
    }

    // Manejo de eventos del teclado sin depender de atributos en línea
    document.querySelectorAll('.keypad button').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            const val = btn.getAttribute('data-val');
            const action = btn.getAttribute('data-action');

            if (val) handleInput(val);
            else if (action === 'clear') handleClear();
            else if (action === 'equals') handleEquals();
            else if (action === 'parens') handleParens();
            else if (action === 'plusminus') handlePlusMinus();
        });
    });

    document.getElementById('btnBackspace').addEventListener('click', handleBackspace);
    document.getElementById('btnHistory').addEventListener('click', () => {
        historyOverlay.style.display = 'block';
    });
    historyOverlay.addEventListener('click', (e) => {
        if (!historyPanel.contains(e.target)) {
            historyOverlay.style.display = 'none';
        }
    });
    document.getElementById('btnClearHistory').addEventListener('click', () => {
        historyData = [];
        updateHistoryUI();
    });

    renderDisplay();
</script>
</body>
</html>
