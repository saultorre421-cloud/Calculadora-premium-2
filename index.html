<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Remesa BCP - Conteo Dinámico por Fajos</title>
    <style>
        /* VARIABLES DE COLOR BCP Y COLORES NEÓN PARA LOS FAJOS */
        :root {
            --bcp-blue: #002A8D;
            --bcp-orange: #FF7900;
            --bg-color: #f4f6f9;
            --text-main: #1e293b;
            --card-bg: #ffffff;
        }

        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding-bottom: 20px;
            user-select: none;
        }

        /* NAVEGACIÓN */
        .tab-container {
            display: flex;
            background: var(--card-bg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .tab-btn {
            flex: 1;
            padding: 16px 0;
            text-align: center;
            font-size: 16px;
            font-weight: 800;
            color: #64748b;
            background: none;
            border: none;
            border-bottom: 4px solid transparent;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn.active {
            color: var(--bcp-blue);
            border-bottom: 4px solid var(--bcp-orange);
            background-color: #f8fafc;
        }

        .tab-content {
            display: none;
            padding: 15px;
            animation: fadeIn 0.25s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* PESTAÑA TOTAL */
        .resumen-container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 2px solid var(--bcp-blue);
            position: relative;
        }

        .resumen-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed #cbd5e1;
        }
        .resumen-row:last-child { border-bottom: none; }

        .resumen-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .resumen-denom { font-size: 24px; font-weight: 900; color: var(--text-main); }

        /* ESTILOS DEL CONTADOR DE BILLETES (INACTIVO) */
        .resumen-qty {
            font-size: 18px;
            font-weight: 900;
            color: #94a3b8;
            background: #f1f5f9;
            padding: 2px 10px;
            border-radius: 6px;
            align-self: flex-start;
            transition: all 0.3s ease;
        }

        /* DINÁMICA DE COLORES POR LOTES/FAJOS */
        .resumen-qty.lote-1 { background-color: #ccff00; color: #000; box-shadow: 0 0 8px rgba(204, 255, 0, 0.6); }
        .resumen-qty.lote-2 { background-color: #ff9900; color: #000; box-shadow: 0 0 8px rgba(255, 153, 0, 0.6); }
        .resumen-qty.lote-3 { background-color: #00e5ff; color: #000; box-shadow: 0 0 8px rgba(0, 229, 255, 0.6); }
        .resumen-qty.lote-4 { background-color: #ff00ff; color: #fff; box-shadow: 0 0 8px rgba(255, 0, 255, 0.6); }

        .resumen-subtotal { font-size: 22px; font-weight: 700; color: var(--text-main); }

        .gran-total-box {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 3px solid var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .gran-total-label { font-size: 24px; font-weight: 900; }
        .gran-total-monto { font-size: 28px; font-weight: 900; color: var(--bcp-blue); }

        .leyenda-colores {
            font-size: 11px;
            color: #64748b;
            text-align: center;
            margin-top: 10px;
            font-weight: 600;
        }

        /* PESTAÑA BILLETES */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
        }

        .card-denom { font-size: 22px; font-weight: 900; color: var(--bcp-blue); width: 70px; }

        .controls {
            display: flex;
            align-items: center;
            background: #f8fafc;
            border-radius: 8px;
            padding: 4px;
            border: 1px solid #cbd5e1;
            width: 140px;
            justify-content: space-between;
        }

        .btn-control {
            background: white;
            border: 1px solid #cbd5e1;
            font-size: 24px;
            font-weight: 700;
            width: 40px;
            height: 40px;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-control:active { background: #e2e8f0; }

        .input-qty {
            width: 50px;
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            border: none;
            background: transparent;
            outline: none;
            color: #000;
        }

        .btn-save {
            background-color: var(--bcp-blue);
            color: white;
            border: none;
            border-radius: 8px;
            height: 48px;
            padding: 0 15px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(0,42,141,0.3);
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            line-height: 1.1;
        }
        .btn-save:active { transform: scale(0.95); background-color: var(--bcp-orange); }
        .btn-save.success { background-color: #10b981; }

        .action-bar { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }
        .btn-global { flex: 1; padding: 12px; font-size: 15px; font-weight: 700; border-radius: 8px; cursor: pointer; border: none; text-align: center; }

        .btn-borrar-input { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        .btn-borrar-input:active { background: #e2e8f0; }

        .btn-guardar-todo { background: var(--bcp-orange); color: white; box-shadow: 0 2px 4px rgba(255,121,0,0.3); }
        .btn-guardar-todo:active { transform: scale(0.98); }

        /* BOTÓN DE ENVÍO A GOOGLE SHEETS */
        .btn-enviar-sheets { 
            background-color: #10b981; 
            color: white; 
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.4); 
            margin-top: 15px; 
            width: 100%; 
            font-size: 16px;
            transition: 0.2s;
        }
        .btn-enviar-sheets:active { transform: scale(0.98); background-color: #059669; }

        .btn-peligro { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; margin-top: 12px; width: 100%; transition: 0.2s; }
        .btn-peligro:active { background: #f87171; color: white; transform: scale(0.98); }

    </style>
</head>
<body>

    <!-- NAVEGACIÓN -->
    <div class="tab-container">
        <button class="tab-btn active" onclick="openTab(event, 'Total')">📋 TOTAL</button>
        <button class="tab-btn" onclick="openTab(event, 'Billetes')">💵 BILLETES</button>
    </div>

    <!-- PESTAÑA: TOTAL -->
    <div id="Total" class="tab-content active">
        <div class="resumen-container">

            <div class="resumen-row">
                <div class="resumen-left">
                    <span class="resumen-denom">S/ 200</span>
                    <span class="resumen-qty" id="tot-qty-b200">0</span>
                </div>
                <div class="resumen-subtotal" id="tot-sub-b200">0.00</div>
            </div>

            <div class="resumen-row">
                <div class="resumen-left">
                    <span class="resumen-denom">S/ 100</span>
                    <span class="resumen-qty" id="tot-qty-b100">0</span>
                </div>
                <div class="resumen-subtotal" id="tot-sub-b100">0.00</div>
            </div>

            <div class="resumen-row">
                <div class="resumen-left">
                    <span class="resumen-denom">S/ 50</span>
                    <span class="resumen-qty" id="tot-qty-b50">0</span>
                </div>
                <div class="resumen-subtotal" id="tot-sub-b50">0.00</div>
            </div>

            <div class="resumen-row">
                <div class="resumen-left">
                    <span class="resumen-denom">S/ 20</span>
                    <span class="resumen-qty" id="tot-qty-b20">0</span>
                </div>
                <div class="resumen-subtotal" id="tot-sub-b20">0.00</div>
            </div>

            <div class="resumen-row">
                <div class="resumen-left">
                    <span class="resumen-denom">S/ 10</span>
                    <span class="resumen-qty" id="tot-qty-b10">0</span>
                </div>
                <div class="resumen-subtotal" id="tot-sub-b10">0.00</div>
            </div>

            <div class="gran-total-box">
                <span class="gran-total-label">TOTAL</span>
                <span class="gran-total-monto" id="gran-total-display">0.00</span>
            </div>
        </div>

        <div class="leyenda-colores">
            Colores por grupo sumado: 🟢 1er ➔ 🟠 2do ➔ 🔵 3er ➔ 🟣 4to+
        </div>

        <!-- Botón para registrar en Google Sheets -->
        <button class="btn-global btn-enviar-sheets" id="btn-sync-sheets" onclick="enviarAGoogleSheets()">📤 Enviar Remesa a Google Sheets</button>

        <button class="btn-global btn-peligro" onclick="reiniciarDepositoTotal()">Borrar Todo el Total (Nuevo Cliente)</button>
    </div>

    <!-- PESTAÑA: BILLETES -->
    <div id="Billetes" class="tab-content">

        <!-- Fila 200 -->
        <div class="card">
            <span class="card-denom">S/ 200</span>
            <div class="controls">
                <button class="btn-control" onclick="modificarInput('inp-b200', -1)">-</button>
                <input type="number" id="inp-b200" class="input-qty" placeholder="0" oninput="actualizarVistaTotal()">
                <button class="btn-control" onclick="modificarInput('inp-b200', 1)">+</button>
            </div>
            <button class="btn-save" id="btn-save-b200" onclick="guardarAlTotal('b200')"><span>+</span>Guardar</button>
        </div>

        <!-- Fila 100 -->
        <div class="card">
            <span class="card-denom">S/ 100</span>
            <div class="controls">
                <button class="btn-control" onclick="modificarInput('inp-b100', -1)">-</button>
                <input type="number" id="inp-b100" class="input-qty" placeholder="0" oninput="actualizarVistaTotal()">
                <button class="btn-control" onclick="modificarInput('inp-b100', 1)">+</button>
            </div>
            <button class="btn-save" id="btn-save-b100" onclick="guardarAlTotal('b100')"><span>+</span>Guardar</button>
        </div>

        <!-- Fila 50 -->
        <div class="card">
            <span class="card-denom">S/ 50</span>
            <div class="controls">
                <button class="btn-control" onclick="modificarInput('inp-b50', -1)">-</button>
                <input type="number" id="inp-b50" class="input-qty" placeholder="0" oninput="actualizarVistaTotal()">
                <button class="btn-control" onclick="modificarInput('inp-b50', 1)">+</button>
            </div>
            <button class="btn-save" id="btn-save-b50" onclick="guardarAlTotal('b50')"><span>+</span>Guardar</button>
        </div>

        <!-- Fila 20 -->
        <div class="card">
            <span class="card-denom">S/ 20</span>
            <div class="controls">
                <button class="btn-control" onclick="modificarInput('inp-b20', -1)">-</button>
                <input type="number" id="inp-b20" class="input-qty" placeholder="0" oninput="actualizarVistaTotal()">
                <button class="btn-control" onclick="modificarInput('inp-b20', 1)">+</button>
            </div>
            <button class="btn-save" id="btn-save-b20" onclick="guardarAlTotal('b20')"><span>+</span>Guardar</button>
        </div>

        <!-- Fila 10 -->
        <div class="card">
            <span class="card-denom">S/ 10</span>
            <div class="controls">
                <button class="btn-control" onclick="modificarInput('inp-b10', -1)">-</button>
                <input type="number" id="inp-b10" class="input-qty" placeholder="0" oninput="actualizarVistaTotal()">
                <button class="btn-control" onclick="modificarInput('inp-b10', 1)">+</button>
            </div>
            <button class="btn-save" id="btn-save-b10" onclick="guardarAlTotal('b10')"><span>+</span>Guardar</button>
        </div>

        <div class="action-bar">
            <button class="btn-global btn-borrar-input" onclick="limpiarInputsActuales()">Borrar Actual</button>
            <button class="btn-global btn-guardar-todo" onclick="guardarTodo()">Guardar Todo 💾</button>
        </div>

    </div>

    <script>
        // URL de tu implementación de Google Apps Script
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz0jWIN_loSAftgC56lUR5Yzrid3qW-qmJBqssVOUHzwZYidNSu2VLEZ-Wq8B2rq3dZ/exec";

        // BÓVEDA PRINCIPAL
        let bodegaAcumulada = { b200: 0, b100: 0, b50: 0, b20: 0, b10: 0 };
        // CONTADOR DE LOTES (Grupos de billetes guardados de la misma denominación)
        let conteoLotes = { b200: 0, b100: 0, b50: 0, b20: 0, b10: 0 }; 

        const valoresNominales = { b200: 200, b100: 100, b50: 50, b20: 20, b10: 10 };

        function openTab(evt, tabName) {
            let tabcontent = document.getElementsByClassName("tab-content");
            for (let i = 0; i < tabcontent.length; i++) {
                tabcontent[i].classList.remove("active");
            }
            let tablinks = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        function formatoMoneda(valor) {
            return valor.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function modificarInput(id, cantidad) {
            let input = document.getElementById(id);
            let valorActual = parseInt(input.value) || 0;
            let nuevoValor = valorActual + cantidad;
            if (nuevoValor >= 0) {
                input.value = nuevoValor;
            } else {
                input.value = ""; 
            }
            actualizarVistaTotal();
        }

        // MOTOR EN TIEMPO REAL CON LÓGICA DE COLORES
        function actualizarVistaTotal() {
            let sumaGranTotal = 0;

            ['b200', 'b100', 'b50', 'b20', 'b10'].forEach(den => {
                let cantidadEnBodega = bodegaAcumulada[den];
                let cantidadEnInput = parseInt(document.getElementById('inp-' + den).value) || 0;
                let loteActual = conteoLotes[den];

                let cantidadVisual = cantidadEnBodega + cantidadEnInput;
                let subtotalVisual = cantidadVisual * valoresNominales[den];

                sumaGranTotal += subtotalVisual;

                let spanQty = document.getElementById('tot-qty-' + den);
                spanQty.innerText = cantidadVisual;

                // Reiniciar clases de color
                spanQty.className = 'resumen-qty'; 

                if (cantidadVisual > 0) {
                    let nivelColor = loteActual;

                    if (loteActual === 0 && cantidadEnInput > 0) nivelColor = 1;

                    if (loteActual > 0 && cantidadEnInput > 0) nivelColor = loteActual + 1;

                    if (nivelColor > 4) nivelColor = 4;

                    spanQty.classList.add('lote-' + nivelColor);
                }

                document.getElementById('tot-sub-' + den).innerText = cantidadVisual > 0 ? formatoMoneda(subtotalVisual) : "0.00";
            });

            document.getElementById('gran-total-display').innerText = formatoMoneda(sumaGranTotal);
        }

        function guardarAlTotal(denominacion) {
            let idInput = 'inp-' + denominacion;
            let cantidadIngresada = parseInt(document.getElementById(idInput).value) || 0;

            if (cantidadIngresada > 0) {
                bodegaAcumulada[denominacion] += cantidadIngresada;
                conteoLotes[denominacion]++; 

                document.getElementById(idInput).value = "";
                actualizarVistaTotal();

                let btn = document.getElementById('btn-save-' + denominacion);
                btn.classList.add('success');
                btn.innerHTML = "✅ Listo";
                setTimeout(() => {
                    btn.classList.remove('success');
                    btn.innerHTML = "<span>+</span>Guardar";
                }, 800);
            }
        }

        function guardarTodo() {
            let hayDatos = false;
            ['b200', 'b100', 'b50', 'b20', 'b10'].forEach(den => {
                if(parseInt(document.getElementById('inp-' + den).value) > 0) {
                    guardarAlTotal(den);
                    hayDatos = true;
                }
            });
            if(hayDatos && navigator.vibrate) navigator.vibrate(100);
        }

        function limpiarInputsActuales() {
            ['b200', 'b100', 'b50', 'b20', 'b10'].forEach(den => {
                document.getElementById('inp-' + den).value = "";
            });
            actualizarVistaTotal();
        }

        function reiniciarDepositoTotal() {
            bodegaAcumulada = { b200: 0, b100: 0, b50: 0, b20: 0, b10: 0 };
            conteoLotes = { b200: 0, b100: 0, b50: 0, b20: 0, b10: 0 };

            limpiarInputsActuales();
            document.querySelectorAll('.tab-btn')[1].click(); 
        }

        // FUNCIÓN QUE ENVÍA LA REMESA A GOOGLE SHEETS
        function enviarAGoogleSheets() {
            let total = 0;
            ['b200', 'b100', 'b50', 'b20', 'b10'].forEach(den => {
                total += bodegaAcumulada[den] * valoresNominales[den];
            });

            if (total === 0) {
                alert("Primero debes registrar billetes en el Total antes de enviar.");
                return;
            }

            let btn = document.getElementById('btn-sync-sheets');
            btn.innerText = "⏳ Enviando a Sheets...";
            btn.disabled = true;

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    b200: bodegaAcumulada.b200,
                    b100: bodegaAcumulada.b100,
                    b50: bodegaAcumulada.b50,
                    b20: bodegaAcumulada.b20,
                    b10: bodegaAcumulada.b10,
                    total: total
                })
            }).then(() => {
                btn.innerText = "✅ ¡Guardado en Sheets!";
                setTimeout(() => {
                    btn.innerText = "📤 Enviar Remesa a Google Sheets";
                    btn.disabled = false;
                }, 2000);
            }).catch(err => {
                console.error("Error al enviar a Sheets:", err);
                btn.innerText = "❌ Error al enviar";
                setTimeout(() => {
                    btn.innerText = "📤 Enviar Remesa a Google Sheets";
                    btn.disabled = false;
                }, 2000);
            });
        }

        window.onload = actualizarVistaTotal;
    </script>
</body>
</html>
